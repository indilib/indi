name: Check Codestyle

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'master'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get INDI Sources
        uses: actions/checkout@v4
        with:
          # HEAD is the merge of the pull request into its base, so HEAD^1 is the base.
          fetch-depth: 2

      - name: Check codestyle of the changed lines in files with suffix cpp,cxx,c,h
        run: |
          sudo apt-get update
          sudo apt-get -qq -y install astyle
          rc=0
          # Bundled third-party libraries keep their own style.
          while IFS= read -r file; do
            echo "changed file $file"
            scripts/check-codestyle.sh "$file" HEAD^1 || rc=1
          done < <(git diff --name-only --diff-filter=AM HEAD^1 HEAD -- . \
                     ':(exclude)libs/fpack' ':(exclude)libs/hid' ':(exclude)libs/httplib' \
                     ':(exclude)libs/modbus' ':(exclude)libs/inicpp.h')
          exit $rc
        shell: bash
