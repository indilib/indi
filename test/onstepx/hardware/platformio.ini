; OnStepX test build for the indi_onstepx driver (ESP32 dev module, MaxESP4 pinmap)
; Arduino-ESP32 2.0.17 (framework-arduinoespressif32 3.20017) — same core as the Arduino IDE build.
[platformio]
src_dir = /path/to/OnStepX   ; OnStepX master checkout with firmware-test-config.patch applied

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
upload_port = /dev/ttyUSB0
upload_speed = 921600
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
